<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Senior AWS Cloud/DevOps Engineer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for professional typography -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">
        <header>
            <div class="header-content">
                <h1 id="profile-name">Loading...</h1>
                <h2 id="profile-title"></h2>
                <p>Date of Birth: <span id="profile-dob"></span></p>
                <span id="profile-status" class="status-badge"></span>
            </div>
            <div class="contact-info">
                <p>Email: <a id="profile-email" href="#"></a></p>
                <p>Phone: <span id="profile-phone"></span></p>
                <p>Location: <span id="profile-location"></span></p>
                <p>LinkedIn: <a id="profile-linkedin" href="#"></a></p>
            </div>
        </header>

        <section class="summary">
            <h3>Professional Summary</h3>
            <p id="summary-content">Loading summary...</p>
        </section>

        <section class="skills">
            <h3>Technical Skills</h3>
            <div class="skills-grid" id="skills-grid">
                <!-- Skills injected by JS -->
            </div>
        </section>

        <section class="experience">
            <h3>Work Experience</h3>
            <div id="experience-section">
                <!-- Experience injected by JS -->
            </div>
        </section>

        <section class="education">
            <h3>Education</h3>
            <div id="education-section">
                <!-- Education injected by JS -->
            </div>
        </section>

        <section class="projects">
            <section class="certifications">
                <h3>Certifications</h3>
                <div class="cert-grid" id="cert-grid">
                    <!-- Certifications injected by JS -->
                </div>
            </section>
        </section>

        <section class="projects">
            <h3>Key Projects</h3>
            <div id="projects-section">
                <!-- Projects injected by JS -->
            </div>
        </section>

        <a href="#" class="download-btn" onclick="window.print(); return false;">Download PDF</a>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
